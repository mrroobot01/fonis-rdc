<!-- Ce fichier n'est jamais affiché aux visiteurs. Il existe uniquement pour que Netlify détecte les formulaires ci-dessous au moment du déploiement. -->
<form name="inscription" data-netlify="true" hidden>
  <input type="text" name="Nom">
  <input type="text" name="Postnom">
  <input type="text" name="Prénom">
  <input type="tel" name="Téléphone">
  <select name="Province"><option>x</option></select>
  <select name="Lieu d'affectation"><option>x</option></select>
  <input type="text" name="Secrétariat général — Type">
  <input type="text" name="Nom du programme spécialisé">
  <input type="text" name="Nom de la direction">
  <select name="Fonction"><option>x</option></select>
  <input type="text" name="Infirmier superviseur — Activité">
  <input type="text" name="Autre fonction — Précision">
  <input type="radio" name="Numéro d'ordre">
  <input type="text" name="Numéro d'ordre — Valeur">
  <input type="radio" name="Salarié">
  <input type="radio" name="Primé">
  <input type="number" name="Année d'affectation">
</form>
<form name="contact" data-netlify="true" hidden>
  <input type="text" name="Nom complet">
  <input type="email" name="email">
  <input type="text" name="Sujet">
  <textarea name="Message"></textarea>
</form>
